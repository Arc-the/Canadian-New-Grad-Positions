name: Update Canada README

on:
  push:
    paths:
      - ".github/scripts/listings.json"
      - ".github/scripts/canada_filter.py"
      - ".github/scripts/update_readmes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Canada location filtering
        run: python .github/scripts/test_canada_filter.py

      - name: Generate Canada-only README
        id: generate
        run: python .github/scripts/update_readmes.py

      - name: Commit README when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already current."
            exit 0
          fi

          count="${{ steps.generate.outputs.canadian_job_count }}"
          git commit -m "docs: update Canada job list (${count:-unknown} active)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
